[package]
name = "braintrust-api-client"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.88.0"
description = "Rust client for the Braintrust REST API"
repository = "https://github.com/braintrustdata/braintrust-sdk-rust"
license = "Apache-2.0"
include = ["src/**/*.rs", "tests/**", "README.md", "LICENSE"]

[dependencies]
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
futures-util = "0.3"
futures-timer = "3"
reqwest-middleware = { version = "0.5", features = ["query"] }
url = { version = "2", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3", features = ["wasm-bindgen"] }

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
wiremock = "0.6"
