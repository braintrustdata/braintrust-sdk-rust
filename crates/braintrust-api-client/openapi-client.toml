[generator]
spec_path = "https://raw.githubusercontent.com/braintrustdata/braintrust-openapi/374478b4a6214e5cf1f32551703bdbc4cea5a7b3/openapi/spec.json"
output_dir = "src/generated"
module_name = "api_types"
non_exhaustive_models = true
overlays = ["openapi-client.overlay.yaml"]

[generator.builders]
enabled = true
threshold = 0

[features]
enable_async_client = true
enable_sse_client = true

[http_client.auth]
type = "Bearer"
header_name = "Authorization"

[http_client.tracing]
enabled = false
