name: Update OpenAPI snapshot

on:
  repository_dispatch:
    types: [braintrust-openapi-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-openapi-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          path: sdk
          persist-credentials: false

      - name: Update snapshot from published spec
        run: >-
          curl --fail --show-error --silent --location
          https://raw.githubusercontent.com/braintrustdata/braintrust-openapi/main/openapi/spec.json
          --output sdk/crates/braintrust-api-client/openapi.json

      - name: Create SDK bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GH_BOT_APP_ID || '1394756' }}
          private-key: ${{ secrets.GH_BOT_APP_PRIVATE_KEY }}
          owner: braintrustdata
          repositories: braintrust-sdk-rust
          permission-contents: write
          permission-pull-requests: write

      # Run even with no diff so an obsolete pending update PR can be closed.
      - name: Open or update SDK PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          path: sdk
          token: ${{ steps.bot.outputs.token }}
          base: main
          branch: chore/update-openapi-snapshot
          title: Update Braintrust API specification
          commit-message: Update Braintrust API specification
          body: |
            Updates the REST API client to the latest published Braintrust specification.
            Source: https://github.com/braintrustdata/braintrust-openapi/blob/main/openapi/spec.json
            SDK CI validates generation and the resulting API behavior.
          add-paths: |
            crates/braintrust-api-client/openapi.json
