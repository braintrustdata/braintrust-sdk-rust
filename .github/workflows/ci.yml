name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, "1.88.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo directories
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.toolchain }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.toolchain }}-cargo-

      - name: Resolve dependencies for the declared minimum Rust version
        run: cargo generate-lockfile

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked --verbose

      - name: Run tests
        run: cargo test --workspace --locked --verbose

      - name: Package workspace crates
        if: matrix.toolchain == 'stable'
        run: cargo package --workspace --locked --no-verify

      - name: Build an offline downstream consumer from the packages
        if: matrix.toolchain == 'stable'
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --no-deps --format-version 1)
          sdk_version=$(jq -r '.packages[] | select(.name == "braintrust-sdk-rust") | .version' <<< "$metadata")
          api_version=$(jq -r '.packages[] | select(.name == "braintrust-api-client") | .version' <<< "$metadata")
          consumer_dir=$(mktemp -d)
          tar -xzf "target/package/braintrust-sdk-rust-$sdk_version.crate" -C "$consumer_dir"
          tar -xzf "target/package/braintrust-api-client-$api_version.crate" -C "$consumer_dir"
          mkdir "$consumer_dir/consumer"
          cat > "$consumer_dir/consumer/Cargo.toml" <<EOF
          [package]
          name = "packaged-client-consumer"
          version = "0.0.0"
          edition = "2024"
          [dependencies]
          braintrust-sdk-rust = { path = "$consumer_dir/braintrust-sdk-rust-$sdk_version" }
          [patch.crates-io]
          braintrust-api-client = { path = "$consumer_dir/braintrust-api-client-$api_version" }
          EOF
          mkdir "$consumer_dir/consumer/src"
          cat > "$consumer_dir/consumer/src/main.rs" <<'EOF'
          use braintrust_sdk_rust::api;
          fn main() {
              let body: api::types::CreateDataset = api::types::CreateDataset::builder()
                  .name("packaged-client").project_id("00000000-0000-0000-0000-000000000001")
                  .try_into().unwrap();
              let client = api::Client::with_api_key("packaged-client-test-key").unwrap();
              let _request = client.post_dataset().body(body);
              assert!(api::OPENAPI_SPEC_SOURCE.starts_with("bundled braintrust-openapi@"));
              assert_eq!(api::OPENAPI_SPEC_SHA256.len(), 64);
          }
          EOF
          CARGO_NET_OFFLINE=true CARGO_TARGET_DIR="$PWD/target" \
            cargo run --offline --manifest-path "$consumer_dir/consumer/Cargo.toml"

  # Check documentation builds
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

