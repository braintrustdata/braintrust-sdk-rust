name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, "1.88.0"]
    env:
      BRAINTRUST_OPENAPI_REQUIRE_REMOTE: "1"
      BRAINTRUST_OPENAPI_REFRESH: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo directories
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.toolchain }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.toolchain }}-cargo-

      - name: Resolve dependencies for the declared minimum Rust version
        run: cargo generate-lockfile

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked --verbose

      - name: Run tests
        run: cargo test --workspace --locked --verbose

      - name: Package workspace crates
        if: matrix.toolchain == 'stable'
        run: cargo package --workspace --locked --no-verify

      - name: Build an offline downstream consumer from the packages
        if: matrix.toolchain == 'stable'
        run: python3 scripts/check-packaged-client.py target/package

  # Check documentation builds
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
          DOCS_RS: "1"

